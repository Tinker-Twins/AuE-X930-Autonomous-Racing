################################################################################
# AMCL
################################################################################

amcl:
  ros__parameters:
    use_sim_time: False # Whether to use simulation time from /clock

    global_frame_id: map           # Global localization frame
    odom_frame_id: odom            # Odometry frame
    base_frame_id: base_link       # Robot base frame
    map_topic: map                 # Occupancy map topic
    scan_topic: scan               # LIDAR scan topic
    tf_broadcast: true             # Whether AMCL broadcasts the map-to-odometry transform
    transform_tolerance: 0.3       # Transform time tolerance (seconds)
    save_pose_rate: 0.5            # Frequency (Hz) for saving the estimated pose
    beam_skip_distance: 0.5        # Distance (meters) used to identify disagreeing LIDAR beams
    beam_skip_error_threshold: 1.0 # Skipped-beam fraction above which all beams are reconsidered
    beam_skip_threshold: 0.3       # Particle agreement fraction required to retain a beam
    do_beamskip: false             # Whether to reject inconsistent beams in supported LIDAR models

    # Measurement model
    laser_model_type: "likelihood_field"  # LIDAR measurement model used to score particles
    laser_max_range: 25.0                 # Maximum accepted LIDAR range (meters)
    laser_min_range: 0.15                 # Minimum accepted LIDAR range (meters)
    max_beams: 150                        # Maximum number of LIDAR beams used per filter update
    lambda_short: 0.1                     # Exponential decay rate for unexpectedly short LIDAR readings
    laser_likelihood_max_dist: 2.0        # Maximum obstacle distance (meters) in the likelihood field
    sigma_hit: 0.10                       # Standard deviation (meters) of the LIDAR hit model
    update_min_a: 0.03                    # Minimum rotation (radians) before a filter update
    update_min_d: 0.03                    # Minimum translation (meters) before a filter update
    z_hit: 0.85                           # Weight of expected obstacle hits in the LIDAR model
    z_max: 0.05                           # Weight of maximum-range readings in the LIDAR model
    z_rand: 0.05                          # Weight of random readings in the LIDAR model
    z_short: 0.05                         # Weight of unexpectedly short readings in the LIDAR model

    # Motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # Motion model used to propagate particles
    alpha1: 0.08                                           # Rotational noise caused by rotation
    alpha2: 0.08                                           # Rotational noise caused by translation
    alpha3: 0.15                                           # Translational noise caused by translation
    alpha4: 0.12                                           # Translational noise caused by rotation
    alpha5: 0.08                                           # Lateral translation noise for the omnidirectional model

    # Particle sampling
    max_particles: 4000       # Upper limit on the particle population
    min_particles: 1000       # Lower limit on the particle population
    pf_err: 0.05              # Allowed particle-filter approximation error
    pf_z: 0.99                # Confidence parameter for adaptive particle sampling
    recovery_alpha_fast: 0.0  # Fast averaging rate for recovery particle injection
    recovery_alpha_slow: 0.0  # Slow averaging rate for recovery particle injection
    resample_interval: 1      # Number of filter updates between particle resampling

amcl_map_client:
  ros__parameters:
    use_sim_time: False # Whether to use simulation time from /clock

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False # Whether to use simulation time from /clock

#################################################################################
# BT NAVIGATOR
################################################################################

bt_navigator:
  ros__parameters:
    use_sim_time: False            # Whether to use simulation time from /clock
    global_frame: map              # Reference frame used by this component
    robot_base_frame: base_link    # Robot base frame
    odom_topic: odometry/filtered  # Odometry topic
    bt_loop_duration: 10           # Behavior tree tick interval (milliseconds)
    default_server_timeout: 20     # Default action server response timeout (milliseconds)
    enable_groot_monitoring: True  # Whether to enable Groot behavior tree monitoring
    groot_zmq_publisher_port: 1666 # Port for publishing Groot monitoring events
    groot_zmq_server_port: 1667    # Port for the Groot monitoring server

    # Behavior tree definitions
    default_nav_to_pose_bt_xml: $(find-pkg-share osracer_navigation)/behavior_trees/navigate_to_pose_no_spin_recovery.xml             # Behavior tree XML for single-goal navigation
    default_nav_through_poses_bt_xml: $(find-pkg-share osracer_navigation)/behavior_trees/navigate_through_poses_no_spin_recovery.xml # Behavior tree XML for navigation through multiple poses
    plugin_lib_names:                                                                                                                 # Behavior tree plugin libraries to load
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False # Whether to use simulation time from /clock

################################################################################
# CONTROLLER SERVER
################################################################################
controller_server:
  ros__parameters:
    use_sim_time: False                                 # Whether to use simulation time from /clock
    controller_frequency: 30.0                          # Control loop frequency (Hz)
    min_x_velocity_threshold: 0.001                     # Minimum longitudinal velocity (m/s) for controller convergence
    min_y_velocity_threshold: 0.5                       # Minimum lateral velocity (m/s) for controller convergence
    min_theta_velocity_threshold: 0.001                 # Minimum angular velocity (rad/s) for controller convergence
    failure_tolerance: 0.3                              # Tolerance for failure detection
    progress_checker_plugin: "progress_checker"         # Plugin identifier for the progress checker
    goal_checker_plugins: ["general_goal_checker"]      # Plugin identifiers for the goal checkers {general_goal_checker, precise_goal_checker}
    controller_plugins: ["FollowPath"]                  # Plugin identifiers for the controller

    ##########################################################################
    # PROGRESS CHECKER
    ##########################################################################
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # Plugin implementation class
      required_movement_radius: 0.5                     # Minimum displacement (meters) to be considered making progress
      movement_time_allowance: 10.0                     # Time (seconds) to allow for movement before considering failure
    
    ##########################################################################
    # GOAL CHECKER
    ##########################################################################

    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"      # Plugin implementation class
      xy_goal_tolerance: 0.25                           # Allowed distance (meters) from the goal to be considered reached
      yaw_goal_tolerance: 0.25                          # Allowed angle (radians) from the goal to be considered reached
      stateful: True                                    # Whether the goal checker maintains state between invocations
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"      # Plugin implementation class
      xy_goal_tolerance: 0.25                           # Allowed distance (meters) from the goal to be considered reached
      yaw_goal_tolerance: 0.25                          # Allowed angle (radians) from the goal to be considered reached
      stateful: True                                    # Whether the goal checker maintains state between invocations
    
    ##########################################################################
    # DWB LOCAL PLANNER – Implements Dynamic Window Approach (DWA)
    ##########################################################################
    
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"               # Plugin implementation class
      debug_trajectory_details: False                   # Whether to publish detailed debug information for each trajectory
      min_vel_x: 0.5                                    # Minimum longitudinal velocity (m/s) for trajectory generation
      min_vel_y: 0.0                                    # Minimum lateral velocity (m/s) for trajectory generation
      max_vel_x: 3.0                                    # Maximum longitudinal velocity (m/s) for trajectory generation
      max_vel_y: 0.0                                    # Maximum lateral velocity (m/s) for trajectory generation
      max_vel_theta: 2.5                                # Maximum angular velocity (rad/s) for trajectory generation
      min_speed_xy: 0.5                                 # Minimum translational speed (m/s) for trajectory generation
      max_speed_xy: 3.0                                 # Maximum translational speed (m/s) for trajectory generation
      min_speed_theta: 0.0                              # Minimum rotational speed (rad/s) for trajectory generation
      acc_lim_x: 4.0                                    # Longitudinal acceleration limit (m/s^2) for trajectory generation
      acc_lim_y: 0.0                                    # Lateral acceleration limit (m/s^2) for trajectory generation
      acc_lim_theta: 3.0                                # Angular acceleration limit (rad/s^2) for trajectory generation
      decel_lim_x: -4.0                                 # Longitudinal deceleration limit (m/s^2) for trajectory generation
      decel_lim_y: 0.0                                  # Lateral deceleration limit (m/s^2) for trajectory generation
      decel_lim_theta: -3.0                             # Angular deceleration limit (rad/s^2) for trajectory generation
      vx_samples: 10                                    # Number of longitudinal velocity samples for trajectory generation
      vy_samples: 5                                     # Number of lateral velocity samples for trajectory generation
      vtheta_samples: 10                                # Number of angular velocity samples for trajectory generation
      sim_time: 1.0                                     # Simulation time (s) for trajectory generation
      linear_granularity: 0.05                          # Linear granularity (m) for trajectory generation
      angular_granularity: 0.025                        # Angular granularity (rad) for trajectory generation
      transform_tolerance: 0.2                          # Transform tolerance (m) for trajectory generation
      xy_goal_tolerance: 0.35                           # Allowed distance (meters) from the goal to be considered reached
      trans_stopped_velocity: 0.25                      # Translational velocity (m/s) below which to consider stopped
      short_circuit_trajectory_evaluation: True         # Whether to stop evaluating trajectories after a valid one is found
      stateful: True                                    # Whether the local planner maintains state between invocations
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02                          # Scaling factor for the base obstacle critic
      PathAlign.scale: 32.0                             # Scaling factor for the path alignment critic
      PathAlign.forward_point_distance: 0.1             # Distance (meters) ahead to evaluate path alignment
      GoalAlign.scale: 24.0                             # Scaling factor for the goal alignment critic
      GoalAlign.forward_point_distance: 0.1             # Distance (meters) ahead to evaluate goal alignment
      PathDist.scale: 50.0                              # Scaling factor for the path distance critic
      GoalDist.scale: 50.0                              # Scaling factor for the goal distance critic
      RotateToGoal.scale: 32.0                          # Scaling factor for the rotate-to-goal critic
      RotateToGoal.slowing_factor: 5.0                  # Factor for slowing down when approaching the goal
      RotateToGoal.lookahead_time: -1.0                 # Lookahead time (s) for the rotate-to-goal critic (-1.0 to disable)

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False                                 # Whether to use simulation time from /clock

################################################################################
# LOCAL COSTMAP
################################################################################

local_costmap:
  local_costmap:
    ros__parameters:
      publish_frequency: 5.0                                              # Costmap publication frequency (Hz)
      update_frequency: 10.0                                              # Costmap update frequency (Hz)
      footprint: '[[0.42,0.14],[0.42,-0.14],[-0.08,-0.14],[-0.08,0.14]]'  # Robot outline as [x, y] points (meters) in the base frame
      footprint_padding: 0.01                                             # Extra padding (meters) around the robot footprint
      global_frame: odom                                                  # Reference frame used by this component
      robot_base_frame: base_link                                         # Robot base frame
      use_sim_time: False                                                 # Whether to use simulation time from /clock
      rolling_window: true                                                # Whether the costmap window follows the robot
      width: 3                                                            # Costmap width (meters)
      height: 3                                                           # Costmap height (meters)
      resolution: 0.05                                                    # Costmap cell size (meters)
      robot_radius: 0.3                                                   # Radius (meters) used when no polygon footprint is supplied
      plugins: ["voxel_layer", "inflation_layer"]                         # Ordered list of costmap layers to load
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Plugin implementation class
        cost_scaling_factor: 3.0                  # Exponential decay factor for inflated obstacle costs
        inflation_radius: 0.3                     # Distance (meters) over which obstacle costs are inflated
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer" # Plugin implementation class
        enabled: True                         # Whether this plugin is enabled
        publish_voxel_map: True               # Whether to publish the obstacle voxel grid
        origin_z: 0.0                         # Height (meters) of the voxel grid origin
        z_resolution: 0.05                    # Vertical voxel size (meters)
        z_voxels: 16                          # Number of vertical voxel cells
        max_obstacle_height: 2.0              # Maximum obstacle height (meters) to consider
        mark_threshold: 0                     # Occupied-voxel threshold for marking a 2D cell occupied
        observation_sources: scan             # Names of sensor sources used by this layer
        scan:
          topic: /scan             # Input topic for this observation source
          data_type: "LaserScan"   # Message type used by the observation source
          max_obstacle_height: 2.0 # Maximum obstacle height (meters) to consider
          clearing: True           # Whether observations clear free space by ray tracing
          marking: True            # Whether observations mark detected obstacles
          raytrace_max_range: 3.0  # Maximum distance (meters) for clearing free space
          raytrace_min_range: 0.0  # Minimum distance (meters) for clearing free space
          obstacle_max_range: 2.5  # Maximum distance (meters) for marking obstacles
          obstacle_min_range: 0.0  # Minimum distance (meters) for marking obstacles
      static_layer:
        map_subscribe_transient_local: True # Whether to request retained map messages with transient-local QoS
      always_send_full_costmap: True        # Whether to publish full maps instead of incremental updates
  local_costmap_client:
    ros__parameters:
      use_sim_time: False # Whether to use simulation time from /clock
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False # Whether to use simulation time from /clock

################################################################################
# GLOBAL COSTMAP
################################################################################

global_costmap:
  global_costmap:
    ros__parameters:
      publish_frequency: 2.0                                         # Costmap publication frequency (Hz)
      update_frequency: 5.0                                          # Costmap update frequency (Hz)
      global_frame: map                                              # Reference frame used by this component
      robot_base_frame: base_link                                    # Robot base frame
      use_sim_time: False                                            # Whether to use simulation time from /clock
      robot_radius: 0.3                                              # Radius (meters) used when no polygon footprint is supplied
      resolution: 0.025                                              # Costmap cell size (meters) MUST MATCH MAP RESOLUTION
      track_unknown_space: true                                      # Whether to preserve unobserved cells as unknown
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # Ordered list of costmap layers to load
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # Plugin implementation class
        enabled: True                            # Whether this plugin is enabled
        observation_sources: scan                # Names of sensor sources used by this layer
        scan:
          topic: /scan             # Input topic for this observation source
          data_type: "LaserScan"   # Message type used by the observation source
          max_obstacle_height: 2.0 # Maximum obstacle height (meters) to consider
          clearing: True           # Whether observations clear free space by ray tracing
          marking: True            # Whether observations mark detected obstacles
          raytrace_max_range: 8.0  # Maximum distance (meters) for clearing free space
          raytrace_min_range: 0.0  # Minimum distance (meters) for clearing free space
          obstacle_max_range: 6.0  # Maximum distance (meters) for marking obstacles
          obstacle_min_range: 0.0  # Minimum distance (meters) for marking obstacles
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # Plugin implementation class
        map_subscribe_transient_local: True    # Whether to request retained map messages with transient-local QoS
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Plugin implementation class
        cost_scaling_factor: 3.0                  # Exponential decay factor for inflated obstacle costs
        inflation_radius: 0.5                     # Distance (meters) over which obstacle costs are inflated
      always_send_full_costmap: True              # Whether to publish full maps instead of incremental updates
  global_costmap_client:
    ros__parameters:
      use_sim_time: False # Whether to use simulation time from /clock
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False # Whether to use simulation time from /clock

################################################################################
# MAP SERVER
################################################################################

map_server:
  ros__parameters:
    use_sim_time: False       # Whether to use simulation time from /clock
    yaml_filename: "map.yaml" # Path to the map metadata YAML file
    map_topic: /map           # Occupancy map topic
    frame_id: map             # Frame assigned to the published map

################################################################################
# MAP SAVER
################################################################################

map_saver:
  ros__parameters:
    use_sim_time: False                 # Whether to use simulation time from /clock
    save_map_timeout: 5.0               # Maximum wait (seconds) for saving a map
    free_thresh_default: 0.25           # Default probability threshold for classifying free cells
    occupied_thresh_default: 0.65       # Default probability threshold for classifying occupied cells
    map_subscribe_transient_local: True # Whether to request retained map messages with transient-local QoS

################################################################################
# PLANNER SERVER
################################################################################

planner_server:
  ros__parameters:
    expected_planner_frequency: 30.0 # Expected planning frequency (Hz) for performance monitoring
    use_sim_time: False              # Whether to use simulation time from /clock
    planner_plugins: ["GridBased"]   # Global planner plugin identifiers
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner" # Plugin implementation class
      tolerance: 0.3                            # Allowed distance (meters) from an unreachable goal
      use_astar: false                          # Whether to use A* search instead of Dijkstra search
      allow_unknown: true                       # Whether the planner may traverse unknown map cells

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False # Whether to use simulation time from /clock

################################################################################
# BEHAVIOR SERVER
################################################################################

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw           # Input costmap topic used by recovery behaviors
    footprint_topic: local_costmap/published_footprint # Input topic for the robot footprint
    cycle_frequency: 10.0                              # Behavior execution frequency (Hz)
    behavior_plugins: ["backup", "wait"]               # Recovery behavior plugin identifiers
    backup:
      plugin: "osracer_aggressive_backup/AggressiveBackUp"               # Plugin implementation class
      scan_topic: scan                                                   # Input LIDAR scan topic
      odom_topic: odometry/filtered                                      # Input odometry topic
      scan_base_frame: base_link                                         # Reference frame for recovery scan processing
      default_distance: 0.6                                              # Configured default recovery travel distance (meters)
      default_speed: 0.3                                                 # Configured default recovery speed (m/s)
      stopped_velocity_threshold: 0.03                                   # Speed threshold (m/s) for detecting a stopped vehicle
      fallback_recovery_direction: backward                              # Fallback travel direction for the custom recovery
      enable_second_phase: false                                         # Whether to enable the custom recovery's second phase
      first_phase_distance_ratio: 0.45                                   # Fraction of recovery distance assigned to the first phase
      second_phase_distance_ratio: 0.55                                  # Fraction of recovery distance assigned to the second phase
      min_exit_clearance: 0.45                                           # Configured minimum recovery exit clearance (meters)
      front_sector_deg: 35.0                                             # Front scan sector angle (degrees)
      rear_sector_deg: 35.0                                              # Rear scan sector angle (degrees)
      scan_timeout: 0.35                                                 # Configured LIDAR scan timeout (seconds)
      clear_local_costmap: true                                          # Whether recovery requests local costmap clearing
      clear_global_costmap: false                                        # Whether recovery requests global costmap clearing
      local_clear_service: local_costmap/clear_entirely_local_costmap    # Service used to clear the local costmap
      global_clear_service: global_costmap/clear_entirely_global_costmap # Service used to clear the global costmap
      costmap_clear_wait_ms: 150.0                                       # Configured costmap-clearing wait (milliseconds)
    wait:
      plugin: "nav2_behaviors/Wait" # Plugin implementation class
      wait_duration: 2.0            # Configured wait duration (seconds)
    global_frame: odom              # Reference frame used by this component
    robot_base_frame: base_link     # Robot base frame
    transform_tolerance: 0.1        # Transform time tolerance (seconds)
    use_sim_time: False             # Whether to use simulation time from /clock
    simulate_ahead_time: 2.0        # Lookahead time (seconds) for behavior collision checking
    max_rotational_vel: 1.0         # Maximum rotational speed (rad/s) for supported behaviors
    min_rotational_vel: 0.4         # Minimum rotational speed (rad/s) for supported behaviors
    rotational_acc_lim: 3.2         # Rotational acceleration limit (rad/s^2)

################################################################################
# ROBOT STATE PUBLISHER
################################################################################

robot_state_publisher:
  ros__parameters:
    use_sim_time: False # Whether to use simulation time from /clock

################################################################################
# WAYPOINT FOLLOWER
################################################################################

waypoint_follower:
  ros__parameters:
    loop_rate: 20                                     # Waypoint follower polling frequency (Hz)
    stop_on_failure: false                            # Whether to stop after a waypoint navigation failure
    waypoint_task_executor_plugin: "wait_at_waypoint" # Plugin identifier for actions performed at waypoints
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint" # Plugin implementation class
      enabled: True                                    # Whether this plugin is enabled
      waypoint_pause_duration: 200                     # Pause duration (milliseconds) at each waypoint