/**:
  ros__parameters:
    control_rate: 10.0            # Control loop execution rate (Hz)
    speed_setpoint: 0.5           # Desired vehicle speed (m/s)
    steer_smoothness: 0.8         # Smoothing factor for steering angle [0.0, 1.0]
    min_scan_angle: -90.0         # Minimum scan angle for gap detection (degrees)
    max_scan_angle: 90.0          # Maximum scan angle for gap detection (degrees)
    vehicle_width: 0.25           # Width of vehicle footprint (m)
    safety_margin: 0.10           # Safety margin around the vehicle (m)
    disparity_threshold: 0.5      # Threshold for identifying a disparity (m)
    perception_verbose: true      # Verbose perception output (boolean)
    control_verbose: true         # Verbose control output (boolean)
